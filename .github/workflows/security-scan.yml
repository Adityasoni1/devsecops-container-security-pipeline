name: DevSecOps Container Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Grants the workflow permission to write to GitHub's Security dashboard
permissions:
  contents: read
  security-events: write

jobs:
  build-and-security-scan:
    name: Build Image & Run Trivy Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t local-test-app:${{ github.sha }} .

      - name: Scan Container Image (SARIF Report)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-test-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload SARIF Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Enforce Security Gate (Exit Code 1 on High/Critical)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-test-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          
